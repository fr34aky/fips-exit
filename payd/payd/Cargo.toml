[package]
name = "fips-exit-payd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The payment service of a paid fips exit: its terms, over the mesh"

[[bin]]
name = "fips-exit-payd"
path = "src/main.rs"

[dependencies]
fips-exit-proto = { path = "../proto" }
# An HTTP server over the mesh, and nothing above it: three routes are a
# match, not a framework. tokio because the Cashu wallet library this
# service is to use needs it.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# The terms are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# To tell whether the node's npub is the address this service answers on:
# a fips address is SHA-256 of the key (as the Cashu wallet library will
# need it anyway).
sha2 = "0.10"
# Packages and their members, kept across restarts. 0.31 and bundled
# because the Cashu wallet library's own store pins that (one SQLite in a
# build); RUSTSEC-2026-0459 is on it: see SECURITY-REVIEW.md.
rusqlite = { version = "0.31", features = ["bundled"] }
# The Cashu wallet, and its store: the one wallet library, so that nothing
# of minting or of blind signatures is written here. Pinned exactly, as the
# family of crates is.
cdk = { version = "=0.18.3", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.18.3", default-features = false, features = ["wallet"] }
# The wallet's seed as words (BIP-39), so that it can be written down, and
# what the wallet holds found again from it, here or in another wallet.
bip39 = { version = "2", default-features = false, features = ["std"] }
# An address a mint gives for a payment on the chain is read before it is
# shown. The wallet library's own version of it.
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
# The invoice as a QR code: the code alone, drawn here as SVG.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
# A real mint, started inside a test, with a Lightning backend that pays
# itself; and a wallet that makes tokens there.
fips-exit-test-mint = { path = "../test-mint" }
