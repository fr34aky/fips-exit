[package]
name = "fips-exit-payd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The payment service of a paid fips exit: its terms, over the mesh"

[[bin]]
name = "fips-exit-payd"
path = "src/main.rs"

[dependencies]
fips-exit-proto = { path = "../proto" }
# An HTTP server over the mesh, and nothing above it: three routes are a
# match, not a framework. tokio because the Cashu wallet library this
# service is to use needs it.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# The terms are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# To tell whether the node's npub is the address this service answers on:
# a fips address is SHA-256 of the key (as the Cashu wallet library will
# need it anyway).
sha2 = "0.10"
# Packages and their members, kept across restarts. 0.31 and bundled
# because the Cashu wallet library's own store pins that (one SQLite in a
# build); RUSTSEC-2026-0459 is on it: see SECURITY-REVIEW.md.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
