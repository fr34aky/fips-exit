[package]
name = "fips-exit-test-mint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Cashu mint for tests: in memory, with a Lightning backend that pays itself"

[dependencies]
cdk = { version = "=0.18.3", default-features = false, features = ["mint", "wallet"] }
cdk-sqlite = { version = "=0.18.3", default-features = false, features = ["mint", "wallet"] }
cdk-fake-wallet = { version = "=0.18.3" }
cdk-axum = { version = "=0.18.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-util"] }
axum = "0.8"
